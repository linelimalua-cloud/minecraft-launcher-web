<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Launcher - Versões Clássicas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Minecraft Launcher</h1>
            <p>Versões Clássicas: 2009, 2010, 2011, 2012</p>
        </header>

        <main>
            <section class="login-section">
                <h2>Login</h2>
                <form id="loginForm">
                    <input type="text" id="username" placeholder="Usuário" required>
                    <input type="password" id="password" placeholder="Senha" required>
                    <button type="submit">Entrar</button>
                </form>
            </section>

            <section class="versions-section" id="versionsSection" style="display: none;">
                <h2>Selecione a Versão</h2>
                <div class="versions-grid" id="versionsGrid"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Minecraft Launcher Web</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
